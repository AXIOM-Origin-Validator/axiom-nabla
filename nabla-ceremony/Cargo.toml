[package]
name = "axiom-nabla-ceremony"
version.workspace = true
edition = "2021"
description = "AXIOM Nabla Ceremony — offline NBC provisioning tool"

[[bin]]
name = "nabla-ceremony"
path = "src/bin/nabla_ceremony.rs"

[dependencies]
axiom-core-logic = { git = "https://github.com/AXIOM-Origin-Validator/axiom-core", tag = "core-b77fd28a", default-features = true, features = ["ceremony"] }
axiom-nabla = { path = "../nabla" }
fips205 = { version = "0.4", features = ["slh_dsa_sha2_128s"] }
fips204 = { version = "0.4", default-features = false, features = ["ml-dsa-65", "default-rng"] }
hex = "0.4"
serde_json = "1"
ed25519-dalek = { version = "2", features = ["serde"] }
rand = "0.8"

[dev-dependencies]
tempfile = "3"
