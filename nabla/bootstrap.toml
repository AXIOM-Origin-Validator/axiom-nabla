# ══════════════════════════════════════════════════════════════════
# AXIOM Nabla — Bootstrap Peers (RUNTIME CONFIG)
#
# This file is NOT compiled into the binary.
# It is read at startup. Edit it any time, then restart your node.
#
# The binary (nabla-node) loads this file via:
#   nabla-node --bootstrap /path/to/bootstrap.toml
#   or automatically from: <data_dir>/bootstrap.toml
#
# Format: TOML array of [[peer]] entries
#   [[peer]]
#   address = "10.0.0.1:6225"
#
#   [[peer]]
#   address = "[2001:db8::1]:6225"       # IPv6
#
#   [[peer]]
#   address = "node1.axiom.network:6225" # Domain name
#
#   - Lines starting with # are comments
#   - Max 128 entries (BOOTSTRAP_PEERS_MAX)
#
# These are network ENTRY POINTS, not privileged nodes.
# After joining, your node discovers peers via gossip.
# If all entries here are dead, your node still works if it
# has any live mesh peer from a previous session.
# ══════════════════════════════════════════════════════════════════

# ── Genesis Nabla Nodes (10 seeds) ──
