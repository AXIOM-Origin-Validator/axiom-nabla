D_RESERVATION_TICKS      = 10   # hold a D slot this long after a child goes offline
PARENTLESS_TIMEOUT_TICKS = 5    # a node with children but no parent must reconnect within this

# §5.5 bottom-up audit (KI#71 option A, 2026-10-01). An upstream now answers an
# AuditRequest at its NEXT root-advertisement instant (the same SMT borrow that
# samples the root it signs for that tick), so an answer arrives up to ~1 tick
# after the challenge. The auditor keeps its pending (prefix, challenge_tick) for
# this many ticks before a re-issue may overwrite it — shorter and every delayed
# honest answer reads `unmatched` (the audit becomes a ghost). Tick COUNT (KI#47).
AUDIT_CHALLENGE_PENDING_TICKS = 2
# Queued AuditRequests from requesters that are NOT a current downstream (or not
# the 8-bit challenge shape) are bounded by this cap; overflow is counted
# (`audit_requests_shed` on /status). Requests from our own D1/D2/P children in
# the 8-bit shape are never shed (dedup bounds them at 256 per child).
AUDIT_INBOX_OTHER_CAP = 64

# Orphan recovery is TWO-PASS (YPX-003 §2.15.2 'Recovery Placement Fix'). Pass 0 insists on a dc=1 parent
# (filling it creates a writer); after this many orphan ticks the node RELAXES
# and accepts any open D slot, because the spec's rule is "never stay orphan".
#
# Sized deliberately short. The failure this exists to prevent is a deadlock,
# not a slow attach: if every dc=1 node in the mesh is itself orphaned, a
# strict-only orphan can NEVER attach — it picks a parent with no upstream, gets
# no grandpa tick, detaches on GRANDPA_MISS_DETACH_THRESHOLD, and repeats
# forever. Observed 2026-08-01 with 8/10 nodes orphaned. Waiting a couple of
# rotations before relaxing costs a little writer-preference; not relaxing at
# all costs the whole mesh.
ORPHAN_STRICT_PASS_TICKS = 6    # test  ~30s at 5s/tick before relaxing
# ORPHAN_STRICT_PASS_TICKS = 12 # prod  ~60s

# ── Serve-gate arming visibility (KI#79) ───────────────────────────────────
#  delta sat UNARMED for 8 HOURS (2026-08-07) emitting an info!-level line
#  every ~5s with no counter — the same log shape as a healthy 2-minute
#  re-arm. Past this many CONSECUTIVE unarmed bootstrap-pull rounds the node
#  escalates to warn! (naming the missing era IDs). A normal restart re-arms
#  in ~24 rounds (~2 min at 5s/tick), so 60 (~5 min) is clearly pathological.
#  Same value for test and prod: the bound is a round COUNT, and the round
#  cadence (one per tick-loop iteration) is the same in both.
UNARMED_ESCALATION_ROUNDS = 60


# ── Grandpa-tick settle (KI#48 — the dc=1 bounce loop) ─────────────────────
#  A child detaches from a parent that is not ALREADY a writer
#  (`parent_is_writer = downstream_approvals >= 2`). But a parent BECOMES a
#  writer only by holding two children — each of which leaves after
#  GRANDPA_MISS_DETACH_THRESHOLD ticks if it has not got there yet. That is
#  circular, and it is what kept the mesh churning: 2,478 successful attaches
#  against 2,147 GrandpaTickMissing detaches in one window.
#
#  This grace gives a freshly-attached parent time to acquire its SECOND child
#  before its children start counting misses against it.
#
#  Sizing: orphan recovery sends attach requests every tick and relaxes at
#  ORPHAN_STRICT_PASS_TICKS (6), so a parent that is going to gain a second
#  child normally does so within a couple of relax cycles. 15 ticks (~75 s) is
#  ~2.5 cycles — comfortably above the relax window, and far below the dead
#  WRITER_SETTLE_TICKS = 50 it replaces in spirit. Worst case before a child
#  gives up on a parent is GRANDPA_SETTLE_TICKS + GRANDPA_MISS_DETACH_THRESHOLD
#  = 25 ticks (~2 min).
GRANDPA_SETTLE_TICKS     = 15   # test  ~75s grace on a NEW parent
# GRANDPA_SETTLE_TICKS   = 30   # prod  ~2.5m

# Consecutive grandpa-tick misses before a child detaches. Was hardcoded in
# tardis.rs; moved here 2026-08-01 so it is reviewable next to its settle.
GRANDPA_MISS_DETACH_THRESHOLD = 10   # ~50s of missed chain proof

