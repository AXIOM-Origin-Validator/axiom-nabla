# ── Join probation (GUIDE §5.6c, KI#75, ruled 2026-09-25) ────────────────────
# A citizen NBC (chain_depth > 0) whose `issued_at` is younger than this many
# ticks is PROBATIONARY on every node that reads it: never a TARDIS writer, not
# counted in OODS, no Nabla emission, its Alerts withheld. Judged from the
# signed certificate only — never a local "joined at" clock — so re-joining,
# hopping peers or restarting cannot reset it. Genesis (chain_depth == 0) exempt.
# ⚠ TICK COUNT (KI#47), projected onto the unix-second stamps via
# `constants::nabla_probation_span_secs` (the KI#40/#165 class). Replaces the
# .rs const NABLA_PROBATION_SECS (48 h) that was never read in production.
nabla_probation_ticks      = 34_560      # 48 h at 5 s/tick — "no one can flood with new Nabla to dilute the security"
nabla_probation_ticks_dev  = 60          # dev twin: 5 min — "in testing should just wait a much shorter time"

# ── NBC issuer self-cap + peer alarm (YPX-002 §9.1.1a, ruled 2026-09-25) ─────
# An attacker WITHOUT an issuing key can only obtain citizen NBCs from honest
# issuers' open join endpoints; probation (above) DELAYS that flood, this CAPS
# it: an issuer REFUSES the N+1-th `NbcIssuanceRequest` it would sign within one
# FOB epoch (`constants::fob_epoch_span_secs(false)` — the REAL fund's cadence,
# the mesh's epoch clock; the dev-FUND cadence is a wallet-class bit, not a
# clock), answering `ISSUER_CAP_REACHED`. Counted from its own signed
# `issued_at` stamps (epoch = issued_at ÷ span, KI#165 style) and PERSISTED in
# the snapshot so a restart does not reset the budget. Every peer ALSO counts
# the certificates it verifies per (issuer, epoch) and logs
# `[NBC-ISSUER-OVER-CAP]` above N — observability only, never a refusal.
# Genesis (chain_depth == 0) is exempt on both sides. Not a wall-clock or tick
# unit: a COUNT of certificates.
# 20/epoch: ~8.7 d real epoch × 10 genesis issuers = 200 citizen joins/week at
# the bootstrap — ample for a curated mesh, small against a flood.
nbc_issuance_max_per_epoch     = 20
nbc_issuance_max_per_epoch_dev = 1000    # dev-MODE twin (100 s epochs): effectively uncapped for soaks

# ── Receipt freshness on /register (KI#53, 2026-08-02) ──────────────────────
# Was a BARE LITERAL 300 in registration.rs with no name and no unit — exactly
# the KI#47 hazard (tick VALUE vs tick COUNT), and invisible to
# check_tick_units.sh because an unnamed number has no `_SECS`/`_TICKS` suffix
# to inspect. Named and registered here so it is tunable and unit-declared.
#
# ⚠ CURRENTLY INERT, BY CONSTRUCTION. The check runs only `if receipt.tick > 0`,
# and `K3Receipt::from_witness_values` sets `tick: 0` (the field doc calls 0 the
# canonical "no timestamp"), so it never fires on a real receipt. Recorded
# rather than deleted because the field is on the wire and a future producer
# could populate it.
#
# ⚠ AND IT INTERACTS WITH THE SUPPLEMENTAL QUEUE. Pending registrations retry
# with exponential backoff capped at 1 HOUR (YP-SDK §8.4), so if this check ever
# went live at 300 it would reject legitimate re-registrations — a queued entry
# is SUPPOSED to be old. Any value chosen here must exceed the retry horizon, or
# the queue must carry tick=0. A design decision is owed before it is switched on.
receipt_staleness_max_ticks = 300

# ── R48 record-AE (Fork Settlement §9o [R58/R59], wave W1, 2026-09-30) ───────
# The receiver-driven descent over each node's RECORD TRIE (graded legs only —
# `nabla/src/record_sync.rs`). Every bound below is what a RESPONDER enforces on
# an ask / what an ASKER enforces on an answer; an ask or answer over a bound is
# REFUSED and counted (`record_ae_refused_oversize`), never trimmed silently.
#
# Shape register: a trie node is INTERNAL iff its subtree holds more than this
# many leaves, else a BUCKET that ships its keys. It is part of the trie's HASH
# (a pure function of the leaf set AND this value), so every node of one mesh
# MUST run the same value — change it only at a coordinated roll.
record_ae_bucket_split           = 32
# Prefixes per `Ask::Nodes` — and the per-level frontier budget of one descent
# (the excess is left for the next descent, which the salted order rotates;
# counted `record_ae_descents_truncated`). Also the cap on legs one descent
# queues for fetching.
record_ae_max_prefixes_per_ask   = 256
# Legs per `Answer::Legs` (and keys per `Ask::Legs`). ≈ 64 × 178 µs ≈ 11 ms of
# off-lock verification per answer (§9b R36 cost).
record_ae_max_legs_per_answer    = 64
# Serialized bytes per answer (1 MiB, far under `transport::WIRE_MAX_MSG_BYTES`);
# a page always carries ≥ 1 item, the asker re-asks the rest (resume).
record_ae_max_answer_bytes       = 1_048_576
# R59 — asks answered per authenticated `from` per window. One descent is
# ≈ depth + 1 asks (+1 per 64 legs fetched); two nodes may walk each other in
# one window.
record_ae_asks_per_from_per_window = 64
# R59 — answers this node sends per window, over ALL askers (the global cap).
# Shedding is liveness only (the asker's descent times out, counted aborted)
# and is counted `record_ae_shed_global`.
record_ae_answers_per_window     = 1_024
# The budget window, in seconds of the node's wall clock (`virtual_secs`).
record_ae_window_secs            = 30
# How long an issued ask stays answerable; a descent whose in-flight ask is
# older is ABORTED (counted) and the peer is walked again later. Seconds of the
# node's wall clock.
record_ae_reply_ttl_secs         = 30
