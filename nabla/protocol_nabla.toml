# ── AE stall alarm (KI#63 §3.3) ───────────────────────────────────────────────
# On 2026-08-04 anti-entropy rejected 115,054 of 115,054 entries over six hours
# — replication was dead while looking busy — and NOTHING said so. The soak
# printed "Real protocol: 100.00%". An outage must not be able to read as a
# healthy run.
#
# Rule: over a window, if AE applied NOTHING while rejecting at least
# MIN_REJECTS, shout. Both zero (a quiet mesh) is silent by construction.
# Tick COUNTS, not seconds (KI#47).
AE_STALL_ALARM_INTERVAL_TICKS = 60    # ~5 min at 5s ticks
AE_STALL_ALARM_MIN_REJECTS    = 20    # below this a window is not evidence
# Fork detections required in the window before "applied nothing" means a STALL
# rather than CONVERGENCE. Without this the alarm fires on a healthy mesh, where
# applying nothing is the normal steady state (every offered entry is already
# held). Measured: healthy soak ~2 per window; the 2026-08-04 incident ~208.
AE_STALL_ALARM_MIN_FORKS      = 20

# ── Tick-denominated durations (KI#47 — read the unit note) ───────────────────
#  A tick's NUMBER is unix seconds; ticks are PRODUCED every TICK_INTERVAL_SECS.
#  So a duration "in ticks" is either a VALUE span (= seconds) or an EVENT count
#  (= seconds / 5). They differ by 5x. See AXIOM_YPX-003_TARDIS.md §1.3.3a.
#  The three values below are EVENT counts, and their call sites compare them
#  against VALUE spans — so each currently enforces 1/5th of its stated intent.
#  Values are moved here UNCHANGED (behaviour-preserving); correcting them is
#  KI#47, whose fix is to TYPE these as TickCount so rustc finds every site.
default_era_duration_ticks = 1_555_200   # 90d as a tick COUNT (projected via .to_secs())
default_era_duration_ticks_dev = 120     # dev ~10m — eras MUST rotate so KI#42/44 get coverage

# ── FOB (Fixed Outflow Balance / Bounded Pools) — docs/AXIOM_DESIGN_BoundedPools.md ──
# ⚠ TICK COUNTS, not seconds (KI#47). The soak's era cadence is 5 s/tick, so
# 150_000 ticks ≈ 8.7 d. Writing the "obvious" week number 604_800 here would be
# a silent 35-day epoch — check_tick_units.sh guards it. The register
# RELATIONSHIP is a boot guard (FobParams::assert_boot_guard), not convention:
# fob_tranche_pct% * fob_dust_cutoff_atoms >= fob_tranche_min_atoms >= minimum_tx_atoms.
# INFRASTRUCTURE params only (Nabla owns the carrier + committee TIMING). Both the
# tranche ECONOMICS (pct/dust_cutoff/tranche_min) AND the §5 mover ELIGIBILITY floor
# (fob_mover_oods_floor_pct) moved to Core (protocol_core.toml, 2026-08-09 ruling):
# Core computes the authoritative amount AND decides who is eligible to author, and
# every Nabla's Core re-verifies both; a Nabla-only tranche or a Nabla-local
# eligibility floor fails open (RULE 5). What stays here is pure carrier timing —
# nothing that gates the validity of a value movement.
fob_tranche_epoch_duration_ticks     = 150_000       # REAL fund epoch: ~8.7d tick COUNT — projected via constants::fob_epoch_span_secs (KI#165: the raw count was used until 2026-09-25 → 1.74 d)
fob_tranche_epoch_duration_ticks_dev = 20            # dev-MODE build twin — 20 ticks × 5 s = 100 s per epoch, the SAME wall cadence the dev soaks had before KI#165 (was 100 raw = 100 s); a soak exercises many full tranche→sweep cycles

