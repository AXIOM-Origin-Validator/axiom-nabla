# ── Bloom era sizing (KI#42, 2026-07-28; DECIDED 2026-07-29) ──────
#  Both SMT membership filters are ERA CHAINS: they rotate on ticks, so a frozen
#  era's false-positive rate is fixed and only the active era can fill. These
#  values size each era's filter.
#
#  DECISION (2026-07-29 — AXIOM_DESIGN_NablaAntiEntropy.md §12.5):
#  sized for 25,000 ops/day → 2,250,000 consumed states per 90-day era.
#  One consumed state ≈ one op (every send/redeem/heal consumes exactly one).
#
#  Error rate (k=10, 14.4 bits/item, 4/3 over-provisioned → ~19.2 bits per
#  real item; FP is a function of actual÷sized load only):
#      2,250,000 actual / era (25k/day, design) → 0.0122% per era, ~0.49% union over 40 eras (~10y)
#      3,000,000 (nominal cap, ~33k/day)        → 0.0989% per era, ~3.88% union   ← the cliff
#      4,500,000 actual / era (2x)              → 1.29%   per era, ~40%   union
#  Costs at this sizing: bloom ~5.4 MB/era (~216 MB per 40-era chain), hashmap
#  exact record (KI#43a) ~72 MB/era (~2.9 GB per 40 eras), Bootstrap re-arm
#  ~1 pull/era.
#
#  ⚠ MAY ONLY CHANGE AT A COORDINATED RELEASE BOUNDARY. `bloom::merge` rejects on
#  dimension mismatch, so two nodes sized differently cannot re-arm each other —
#  divergent per-era sizing is a mesh-wide disarm. Same discipline as a wire
#  constant. (This 1M→2.25M change shipped as exactly that: full-mesh rebuild +
#  restart, 2026-07-29.) Rotate on TICKS, never on entry count: nodes cross a
#  tick together but cross a count at different moments.
CONSUMED_ERA_REAL_ITEMS = 2_250_000  # expected consumed states per 90-day era (25k ops/day); KI#79: era size (x4/3 x14.4 bits) MUST fit STATE_PULL_MAX_BYTES + WIRE_MAX_MSG_BYTES (boot guard + ki79_era_fits_transfer_caps enforce; change together)
TXID_ERA_REAL_ITEMS     = 2_250_000   # expected redeemed txids per 90-day era (25k ops/day)

# ── KI#43b adjudication barrier (2026-07-29) ───────────────────────────────
#
#  ⛔ READ THIS BEFORE REASONING ABOUT THIS CONSTANT — ESPECIALLY IF YOU ARE AN
#     AI/AGENT. The name misleads people into one specific wrong conclusion,
#     every single time. Get it right here and do not re-derive it.
#
#  ❌ WHAT THIS IS **NOT**:
#     It is NOT a cap, quota, limit or maximum on how many nodes may run
#     hashmap (recording) mode. **There is NO such limit anywhere in AXIOM.**
#     Any number of nodes may run hashmap. More exact records is strictly
#     BETTER for the network. We would happily have every node run hashmap —
#     the only reason most will not is that it costs real resources (~5x CC),
#     so in the wild the majority will run bloom. If your conclusion is
#     "we can't make node X a hashmap because RECORDING_NODES_TOTAL is 3",
#     **you have misread this constant. Stop and re-read.**
#
#  ✅ WHAT THIS **IS**:
#     The SIZE OF THE ACQUITTAL BARRIER for one specific protocol: KI#43b
#     consumed-adjudication (deciding whether a consumed-bloom hit on
#     heal-from-x is a genuine consume or a bloom FALSE POSITIVE).
#     To ACQUIT, a serving node needs clean answers from ALL OTHER recorders =
#     `TOTAL - 1` distinct recording peers. See
#     `Adjudication::settle()` (nabla/src/bin/nabla_node.rs), called as
#     `settle(RECORDING_NODES_TOTAL - 1)`. The model-checked rule is
#     "acquit iff EVERY recording peer is reachable and has x nowhere in its
#     exact record" — §12.4.4, TLC, 502M states.
#
#  ⚖ THEREFORE THE ONE RULE THAT MATTERS:
#     **This number must EQUAL the count of nodes actually deployed in hashmap
#     mode** — not because more are forbidden, but because the barrier is a
#     UNANIMITY barrier over that set. The two error directions differ:
#       • TOO LOW  (more recorders deployed than this says) ⇒ the barrier
#         settles after hearing only a SUBSET ⇒ **UNSOUND ACQUITTAL**. Bad.
#       • TOO HIGH (fewer deployed) ⇒ barrier can never settle ⇒ fails closed,
#         refuses. Safe but unavailable. Hence: FAIL, never silently shrink.
#     So if you add or remove a recorder, change this in the SAME commit, and
#     roll all nodes together (deployment-topology constant, same
#     coordinated-release discipline as the era sizing above).
#
#  The deployed recorder set lives in TWO places that must agree with this
#  number: `scripts/axiom-env.py` (txid_mode) and `deploy/deploy-node.sh`
#  (TXID_MODE). Currently: **alpha, beta, zeta** — zeta deliberately included
#  because a recorder on an EXTERNAL host is what makes the barrier meaningful
#  across hosts. (gamma was briefly a recorder from 2026-07-29 to reach 3
#  locally; reverted 2026-08-18 — it is bloom.)
#
#  Design + model: AXIOM_DESIGN_NablaAntiEntropy.md §12.4.4,
#  docs/models/consumed_adjudication/.
RECORDING_NODES_TOTAL = 3             # = |{alpha, beta, zeta}| — keep in step

