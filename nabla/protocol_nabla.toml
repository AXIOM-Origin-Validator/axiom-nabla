# ⚠ UNUSED as of 2026-08-01. Declared here and re-exported in constants.rs, but
#   consumed by NOTHING in nabla/. Its comment also claimed
#   ">= PARENT_ROTATION_INTERVAL", which is false (50 vs 2000). So the anti-bounce
#   protection it advertised has never actually run. Kept (not deleted) because
#   the writer-check may want its own settle later — but do NOT assume it guards
#   anything today. The grandpa path's settle is GRANDPA_SETTLE_TICKS below.
WRITER_SETTLE_TICKS      = 50   # UNUSED — see note above
                                #   (>= PARENT_ROTATION_INTERVAL; avoids dc=1 bounce loops)
WRITER_GRACE_TICKS       = 100  # consecutive non-writer ticks before a child detaches
                                #   (~8 min; bumped from 3 at KI#18 to stop tree thrash)
