[package]
name = "axiom-nabla"
version.workspace = true
edition = "2021"
description = "AXIOM Nabla — citizen infrastructure for wallet state verification"

[[bin]]
name = "nabla"
path = "src/bin/nabla.rs"

[[bin]]
name = "nabla-sim"
path = "src/bin/nabla_sim.rs"

[[bin]]
name = "nabla-node"
path = "src/bin/nabla_node.rs"

[dependencies]
# KI#86: jemalloc returns freed memory to the OS; glibc arena fragments under
# gossip allocation churn (~60 MB/hr/node RSS creep, live-A/B-confirmed). Host-side,
# CoreID-neutral. Wired always-on in src/bin/nabla_node.rs.
tikv-jemallocator = "0.6"
axiom-core-logic = { git = "https://github.com/AXIOM-Origin-Validator/axiom-core", tag = "core-d1e5cb67", default-features = true, features = ["ceremony"] }
axiom-dmap-vm = { git = "https://github.com/AXIOM-Origin-Validator/axiom-core", tag = "core-d1e5cb67", default-features = true, features = ["riscv-interpreter"] }
axiom-denomination = { git = "https://github.com/AXIOM-Origin-Validator/axiom-lib", tag = "lib-v3.7.1" }
axiom-zk-vm = { git = "https://github.com/AXIOM-Origin-Validator/axiom-core", tag = "core-d1e5cb67", default-features = false, features = ["verify"] }
# Structured error responses (AXIOM_YellowPaper_Errors.md Phase 2c).
axiom-errors = { workspace = true, features = ["std"] }
blake3 = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
bincode = "1"
ciborium = { workspace = true }
serde_json = "1"
toml = "0.8"
ed25519-dalek = { version = "2", features = ["serde"] }
rand = "0.8"
log = "0.4"
env_logger = "0.11"
thiserror = "1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
socket2 = "0.5"
fips205 = { version = "0.4", features = ["slh_dsa_sha2_128s"] }
fips204 = { version = "0.4", default-features = false, features = ["ml-dsa-65", "default-rng"] }
# SIGTERM/SIGINT trap so Nabla can flush pool state + take a final
# snapshot before the env's SIGKILL backstop fires (see Fix #4 from
# the 2026-05-24 financial-rigor follow-up). Without this, in-flight
# gossip stats + WAL tail-bytes that hadn't reached a checkpoint
# could be lost on signal-driven shutdown. Pool state is already
# atomic-written on every mutation; the handler is defense-in-depth.
ctrlc = { version = "3", features = ["termination"] }

[features]
dev-status = []
# Allow --dev flag in release builds (for testnet). Mainnet builds omit this.
# ⚠ KI#240: it NO LONGER selects the protocol_nabla.toml DEV twins — `dev-tuning`
# below does. They were one switch, so the only way to launch `--dev` was to also
# run dev era/FOB/probation/NBC-cap timing, and on a ceremony-keyed tree that
# contradicts the owner ruling (2026-10-01: real timing everywhere).
dev-mode = []
# Select the DEV twin of every protocol_nabla.toml register (era duration, FOB
# tranche epoch, emission caps, FOB substitution grace, runner claim, join
# probation, NBC issuance cap). VALUES ONLY — relaxes no check. Same split as
# lambda's `dev-tuning` (KI#136). Passed ONLY by the one rule:
# $(python3 scripts/build_profile.py --features axiom-nabla) — i.e. a dev-keyed tree.
dev-tuning = []
# Dev-only FLOOD CHAOS (src/flood_chaos.rs, ForkSettlement §9o proof obligations, KI#235/#236):
# a per-node switch file `<data_dir>/flood-chaos` makes THIS node drop / hold+reorder the outbound
# floods and head-AE entries of named wallets / txids, so a live gate can build the lost-flood
# redeem fork and the honest reorder (tests/double_spend_fork_test.py --lost-flood /
# --honest-reorder). Record-AE and ForkBan are never suppressed. NOT implied by dev-mode; the dev
# build in scripts/axiom-env.py passes it explicitly and preflight
# (scripts/check_flood_chaos_dev_only.sh) refuses any other recipe. NEVER FOR PRODUCTION.
flood-chaos = []
# Gate pulse calibration behind Lambda benchmark (production release only)
pulse-gate = ["axiom-dmap-vm/pulse-gate"]

[dev-dependencies]
axiom-nabla-ceremony = { path = "../nabla-ceremony" }
tempfile = "3"
